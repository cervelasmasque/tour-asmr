name: Compiler l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparer Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Compiler l'APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android Debug" build/tour-asmr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tour-asmr-apk
          path: build/tour-asmr.apk
